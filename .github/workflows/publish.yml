name: Publish to Homebrew

on:
  release:
    types: [published]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, zip, gd
          ini-values: phar.readonly=0
          coverage: none

      - name: Install dependencies
        run: composer install --no-dev --no-interaction --prefer-dist

      - name: Install Box
        run: |
          mkdir -p bin-box
          composer require humbug/box --working-dir=bin-box

      - name: Build PHAR
        run: bin-box/vendor/bin/box compile

      - name: Verify PHAR
        run: |
          chmod +x build/qr-images.phar
          ./build/qr-images.phar --version
          ./build/qr-images.phar --help

      - name: Upload PHAR to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: build/qr-images.phar
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate SHA256
        id: sha256
        run: |
          echo "sha256=$(sha256sum build/qr-images.phar | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Print SHA256
        run: |
          echo "${{ steps.sha256.outputs.sha256 }}"

      # - name: Upload PHAR as artifact
      #   uses: actions/upload-artifact@v6
      #   with:
      #     name: qr-images-phar
      #     path: build/qr-images.phar
      #     retention-days: 30
